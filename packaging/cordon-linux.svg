<?xml version="1.0" encoding="UTF-8"?>
<!-- Icon for CORDON-LINUX: a PDA-style badge with the amber accent of the launcher theme. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2721"/>
      <stop offset="1" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3325"/>
      <stop offset="1" stop-color="#241f16"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="18" fill="url(#body)" stroke="#4a4137" stroke-width="3"/>
  <rect x="18" y="20" width="92" height="62" rx="8" fill="url(#screen)" stroke="#5b5045" stroke-width="2"/>

  <!-- the "C" of CORDON, drawn as a broken ring -->
  <path d="M78 36a26 26 0 1 0 0 30" fill="none" stroke="#ffb000" stroke-width="9" stroke-linecap="round"/>
  <circle cx="78" cy="51" r="4" fill="#ffb000"/>

  <!-- priority bars: lower bar wins, exactly like the mod list -->
  <rect x="24" y="92" width="34" height="6" rx="3" fill="#7bb662"/>
  <rect x="24" y="102" width="52" height="6" rx="3" fill="#e0a63a"/>
  <rect x="24" y="112" width="70" height="6" rx="3" fill="#e2564b"/>
</svg>
