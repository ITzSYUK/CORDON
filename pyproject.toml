[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cordon-linux"
version = "0.1.0"
description = "CORDON-LINUX - profile & mod launcher for S.T.A.L.K.E.R. on Linux, tuned for the OpenXRay engine"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "CORDON-LINUX contributors" }]
keywords = ["stalker", "openxray", "x-ray", "mod-manager", "launcher", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/ITzSYUK/CORDON"
Upstream = "https://github.com/ITzSYUK/CORDON"
Engine = "https://github.com/OpenXRay/xray-16"

[project.scripts]
cordon = "cordon.cli:main"
cordon-gui = "cordon.gui.launch:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cordon*"]

[tool.setuptools.package-data]
cordon = ["assets/*.svg", "assets/*.png", "assets/*.desktop", "assets/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests/cordon"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:cordon.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM108", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
